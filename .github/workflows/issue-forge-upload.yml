name: Issue Forge Upload

# CLI troubleshooting (Codespaces & local):
# Codespaces may inject a limited GITHUB_TOKEN that cannot dispatch
# workflow_dispatch workflows via `gh workflow run`.
# Re-auth `gh` with workflow scope before dispatching:
#   unset GITHUB_TOKEN
#   unset GH_TOKEN
#   gh auth login -h github.com -p https -s repo,workflow
# Verify with:
#   gh auth status
# Expected scopes include: repo, workflow

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "JSON manifest content to run with Issue Forge"
        required: true
        type: string

jobs:
  run-issue-forge:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so scripts and dependency files are available.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install uv for Python/runtime management.
      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      # Install Python and sync dependencies from pyproject.toml.
      - name: Install dependencies
        run: |
          uv python install 3.11
          uv sync --group dev

      # Write the provided manifest input to a file for the CLI.
      - name: Write manifest file
        run: |
          cat << 'EOF' > manifest.json
          ${{ github.event.inputs.manifest }}
          EOF

      # Run Issue Forge with Jira credentials from repository secrets.
      - name: Run Issue Forge
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          uv run python scripts/emit_phase1.py manifest.json --format json
